[project]
name = "claude-skills-dashboard"
version = "0.1.0"
description = "A TUI dashboard for monitoring Claude Code skill usage"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["claude", "claude-code", "skills", "monitoring", "tui", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "textual>=0.47.0",
    "pydantic>=2.0.0",
    "watchdog>=3.0.0",
    "python-dateutil>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/malcolndandaro/claude-skills-dashboard"
Repository = "https://github.com/malcolndandaro/claude-skills-dashboard"
Issues = "https://github.com/malcolndandaro/claude-skills-dashboard/issues"

[project.scripts]
claude-skills-dashboard = "claude_skills_dashboard.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_skills_dashboard"]
